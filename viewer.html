<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex, nofollow">
  <title>Report Viewer — HonorVet Dashboard Portal</title>

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/light.css">

  <!-- ==========================================================
       AUTH GATE — the viewer is locked to the department named in
       the ?dept= query string, so an HR session cannot open an
       Executive report by editing the URL.
       ========================================================== -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    HVAuth.guard(new URLSearchParams(window.location.search).get("dept"));
  </script>
</head>

<body class="theme-light viewer-body" data-page="viewer">

  <noscript>
    <div class="noscript-banner">
      This portal requires JavaScript to verify your department access.
      Please enable JavaScript and reload the page.
    </div>
  </noscript>

  <!-- ===================== TOP APP BAR ===================== -->
  <header class="app-bar">
    <a class="btn-back" id="backBtn" href="index.html"
       aria-label="Back to department dashboards" title="Back to dashboards">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="20" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>
    </a>

    <div class="app-ident">
      <span class="app-tile" id="deptIcon"></span>
      <div class="app-titles">
        <span class="app-eyebrow"><span id="deptChip">Department</span> &middot; Power BI report</span>
        <h1 class="app-title" id="viewerTitle">Report</h1>
      </div>
    </div>

    <p class="sr-only" id="viewerDesc"></p>

    <div class="app-tools" style="margin-left:auto">
      <button class="btn btn-subtle btn-icon" id="reloadBtn" type="button"
              aria-label="Reload report" title="Reload report">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.7 9.7 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.7 9.7 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></svg>
      </button>

      <button class="btn btn-subtle btn-icon" id="fullscreenBtn" type="button"
              aria-label="Toggle fullscreen" title="Fullscreen">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
      </button>

      <button class="btn btn-subtle" id="newTabBtn" type="button" title="Open in new tab">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10.5 13.5 21 3"/><path d="M20 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
        <span class="btn-label">New tab</span>
      </button>

      <button class="btn btn-subtle btn-logout" type="button" data-logout>
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="btn-label">Logout</span>
      </button>
    </div>
  </header>

  <!-- ===================== REPORT STAGE ===================== -->
  <div class="viewer-stage" id="viewerStage">

    <iframe id="viewerFrame" class="viewer-frame" title="Power BI report"
            allowfullscreen loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <!-- Loading state -->
    <div class="viewer-overlay" id="viewerLoading">
      <div class="spinner"></div>
      <p class="viewer-loading-label">Loading Power BI report…</p>
    </div>

    <!-- Blocked-embed / not-configured / not-found state (filled by app.js) -->
    <div class="viewer-overlay" id="viewerFallback" hidden></div>

  </div>

  <div class="toast-stack" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
